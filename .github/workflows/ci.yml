name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Go einrichten
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt prüfen
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Nicht gofmt-konform:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -count=1

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: evaluation/requirements.txt

      - name: Python-Abhängigkeiten installieren
        run: pip install -r evaluation/requirements.txt

      - name: Go gegen SciPy vergleichen
        run: python evaluation/compare.py --path testdata/winequality-red.csv --column density --tol 1e-3
      
      

  benchmark:
    # Nur manuell oder wöchentlich: Laufzeiten auf Shared Runnern schwanken, daher kein Gate.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Go einrichten
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: evaluation/requirements.txt

      - name: Python-Abhängigkeiten installieren
        run: pip install -r evaluation/requirements.txt

      - name: Benchmarks ausführen (godist vs. SciPy)
        run: python evaluation/bench.py run --repeat 3

      - name: Ergebnisse hochladen
        uses: actions/upload-artifact@v4
        with:
          name: bench-results-${{ github.run_id }}
          path: evaluation/bench_results/
          retention-days: 90
