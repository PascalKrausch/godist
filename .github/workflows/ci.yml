name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Go einrichten
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt prüfen
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Nicht gofmt-konform:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -count=1

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: evaluation/requirements.txt

      - name: Python-Abhängigkeiten installieren
        run: pip install -r evaluation/requirements.txt

      - name: Go gegen SciPy vergleichen
        run: python evaluation/compare.py --path testdata/winequality-red.csv --column density --tol 1e-3
